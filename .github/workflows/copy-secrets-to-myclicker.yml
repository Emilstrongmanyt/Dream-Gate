# One-shot helper: copy shared Apple/Unity secrets to the MyClicker repo.
# Does not print secret values.

name: Copy secrets to MyClicker

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy shared secrets
        env:
          GH_TOKEN: ${{ secrets.MYCLICKER_SECRETS_PAT }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          APPLE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MYCLICKER_SECRETS_PAT is not set on Dream-Gate"
            exit 1
          fi
          repo="Emilstrongmanyt/MyClicker"
          printf '%s' "$UNITY_EMAIL" | gh secret set UNITY_EMAIL -R "$repo"
          printf '%s' "$UNITY_PASSWORD" | gh secret set UNITY_PASSWORD -R "$repo"
          printf '%s' "$UNITY_SERIAL" | gh secret set UNITY_SERIAL -R "$repo"
          printf '%s' "$APPLE_CONNECT_ISSUER_ID" | gh secret set APPLE_CONNECT_ISSUER_ID -R "$repo"
          printf '%s' "$IOS_P12_BASE64" | gh secret set IOS_P12_BASE64 -R "$repo"
          printf '%s' "$IOS_P12_PASSWORD" | gh secret set IOS_P12_PASSWORD -R "$repo"
          echo "Copied shared Unity/Apple secrets to $repo"
          gh secret list -R "$repo"
