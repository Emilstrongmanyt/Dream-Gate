name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test --nologo
      - name: IP guardrail grep
        run: |
          set -e
          hits="$(grep -R -n -E 'Bob|Battlegrounds|Hearthstone|Tavern' client content 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "IP ban list matched in client/ or content/"
            exit 1
          fi
          echo "IP guardrails clean"
