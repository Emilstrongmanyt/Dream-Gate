services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kindling
      POSTGRES_PASSWORD: kindling
      POSTGRES_DB: kindling
    ports:
      - "5432:5432"
    volumes:
      - kindling_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  kindling_pg:
