services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kindling
      POSTGRES_PASSWORD: kindling
      POSTGRES_DB: kindling
    ports:
      - "5432:5432"
    volumes:
      - kindling_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  matchhost:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis:6379
      KINDLING_PEPPER: kindling-dev-pepper
    depends_on:
      - redis

volumes:
  kindling_pg:
